databases:
  - name: operations-db
    plan: free
    databaseName: operations_hub
    user: hub

services:
  - type: web
    name: operations-hub
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /live
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: operations-db
          property: connectionString
      - key: AI_BASE_URL
        value: http://127.0.0.1:4000
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
